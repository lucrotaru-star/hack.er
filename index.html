<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hack.er // Terminal</title>
    <!-- Подключаем внешние стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ЭКРАН ПОИСКА ИД -->
    <div id="search-screen" class="terminal">
        <h1>Hack.er</h1>
        <div class="subtitle">ВВЕДИТЕ ID ХАКА</div>
        <div class="input-group">
            <input type="text" id="hack-id" placeholder="0000" autocomplete="off">
        </div>
        <button onclick="processHackId()">Инициализировать</button>
        <div id="status-message" class="status-msg hidden"></div>
    </div>

    <!-- ЭКРАН ВСТРОЕННОЙ КОМАНДНОЙ СТРОКИ (CMD) -->
    <div id="cmd-screen" class="terminal hidden">
        <h1>CMD TERMINAL</h1>
        <div class="subtitle" style="color: #ffff33;">ROOT ACCESS ACTIVE</div>
        
        <div id="cmd-log" class="cmd-log-box">
            Microsoft Windows [Hacker Edition]<br>
            (c) Корпорация Системного Взлома, 2026.<br><br>
            Вводите команды: todo, openid, deladmin...<br>
        </div>

        <div class="input-group">
            <input type="text" id="cmd-input" placeholder="Введите команду..." autocomplete="off" style="text-align: left; letter-spacing: 1px;">
        </div>
        <button onclick="executeCmdCommand()">Выполнить</button>
        <button onclick="closeCmd()" style="border-color: #ff3333; color: #ff3333; margin-left: 10px;">Выход</button>
    </div>

    <!-- ЭКРАН РЕЗУЛЬТАТА ХАКА -->
    <div id="result-screen" class="terminal hidden">
        <h1>ACCESS GRANTED</h1>
        
        <div class="flag-box">
            <img id="res-flag" src="" alt="Флаг страны">
        </div>

        <div class="info-field">
            <span class="info-label">> КЛЮЧЕВАЯ ГЕОЛОКАЦИЯ:</span> <span id="res-country">...</span>
        </div>
        
        <div class="info-field">
            <span class="info-label">> ВЛАДЕЛЕЦ (OWNER):</span> <span id="res-owner">...</span>
        </div>

        <div class="info-label" style="text-align: left; margin-top: 15px;">> ОПИСАНИЕ ИЗ БАЗЫ:</div>
        <div id="res-description" class="description-box">...</div>

        <br>
        <button onclick="resetTerminal()">Очистить логи</button>
    </div>

    <!-- Подключаем внешнюю логику JavaScript -->
    <script src="script.js"></script>
</body>
</html>
